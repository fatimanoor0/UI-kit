<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reusable UI Kit</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>Reusable UI Kit</h1>
    <p>Buttons, Cards, Modals & Toast Notifications</p>
  </header>

  <main>
    <section>
      <h2>Buttons</h2>
      <div id="buttons" class="button-container"></div>
    </section>
    <section>
      <h2>Cards</h2>
      <div id="cards" class="card-container"></div>
    </section>
    <section>
      <h2>Modal</h2>
      <div id="modal-demo"></div>
    </section>

    <!-- Toast -->
    <section>
      <h2>Toast Notifications</h2>
      <div id="toast-demo"></div>
    </section>

  </main>

  <div id="modal-container"></div>
  <div id="toast-container"></div>

  <script src="script.js"></script>
</body>
</html>
